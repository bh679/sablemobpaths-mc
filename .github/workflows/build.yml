name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew build --no-daemon
      - name: Verify mixin targets against the pinned Sable jar
        run: scripts/verify-mixin-targets.sh "$(find ~/.gradle/caches -name 'sable-*+mc1.21.1.jar' | grep -v sources | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
