# Gradle / JVM
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment mappings — readable parameter names + javadoc.
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge
# Latest at https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.230
loader_version_range=[1,)

# Mod
mod_id=sablemobpaths
mod_name=Sable Mob Paths
mod_license=PolyForm Shield 1.0.0
mod_version=0.4.0
mod_group_id=games.brennan.sablemobpaths
mod_authors=Brennan Hatton
mod_description=Lets ground mobs path between Sable sub-levels and the world: onto a moving structure, off it, and from one to the next. Villagers can live and work on one. Turns itself off if Sable Pathfinder is installed.

# ─────────────────────────────────────────────────────────────────────────────
# Sable — the sub-level / physics mod these paths cross.
# https://modrinth.com/mod/sable  ·  https://github.com/ryanhcode/sable
#
# MINIMUM range. The mixins hook vanilla pathing and call Sable's EntityMovementExtension
# and PathExtension ducks (checked by scripts/verify-mixin-targets.sh on every sable_version bump).
#
# NEVER bundled — Sable is PolyForm Shield 1.0.0, which does not permit it.
# End users install Sable separately; neoforge.mods.toml declares it required.
# ─────────────────────────────────────────────────────────────────────────────
sable_version=2.0.5+mc1.21.1

# The bare modId version Sable declares in ITS OWN neoforge.mods.toml (no +mc…
# suffix — that suffix is only Modrinth's artifact coordinate). Rendered into
# our neoforge.mods.toml as versionRange="[${sable_mod_version},)".
# Must equal sable_version's leading semver (the part before '+').
sable_mod_version=2.0.5
